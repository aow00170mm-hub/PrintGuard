version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/native-agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/service-host"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

