<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintGuard 控制台</title><link rel="stylesheet" href="styles.css"></head>
<body><aside><div class="brand"><span>PG</span><b>PrintGuard</b></div><nav><a class="active">總覽</a><a href="#printers">印表機政策</a><a href="#jobs">列印工作</a></nav><div class="side-note">管理節點<br><strong>● 運作正常</strong></div></aside>
<main><header><div><p class="eyebrow">列印治理中心</p><h1>早安，管理員</h1><p>即時掌握設備、工作與政策執行情形。</p></div><button id="refresh">重新整理</button></header>
<section class="stats"><article><small>今日完成工作</small><strong id="totalJobs">0</strong><em>筆成功列印</em></article><article><small>今日列印頁數</small><strong id="totalPages">0</strong><em>完成頁面數</em></article><article><small>今日政策攔截</small><strong id="blocked">0</strong><em>筆已阻擋</em></article><article><small>在線設備</small><strong id="online">0</strong><em>台可用</em></article></section>
<section id="printers"><div class="section-title"><div><p class="eyebrow">裝置政策</p><h2>印表機狀態</h2></div></div><div id="printerGrid" class="printer-grid"></div></section>
<section class="two-col"><div id="jobs" class="panel"><div class="section-title"><div><p class="eyebrow">即時活動</p><h2>最近工作</h2></div></div><div class="table-wrap"><table><thead><tr><th>文件／AD 使用者</th><th>設備</th><th>頁數</th><th>色彩／面數</th><th>狀態</th></tr></thead><tbody id="jobRows"></tbody></table></div></div></section>
<section class="panel report"><div class="section-title"><div><p class="eyebrow">AD 用量分析</p><h2>使用者列印報表</h2></div><button id="reportRefresh">更新報表</button></div><div class="table-wrap"><table><thead><tr><th>AD 使用者</th><th>印表機</th><th>工作</th><th>總頁數</th><th>黑白</th><th>彩色</th><th>單面</th><th>雙面</th><th>紙張</th></tr></thead><tbody id="reportRows"></tbody></table></div></section>
<section id="violations" class="panel"><div class="section-title"><div><p class="eyebrow">政策稽核</p><h2>已阻擋工作（不計入報表）</h2></div></div><div class="table-wrap"><table><thead><tr><th>時間</th><th>AD 使用者</th><th>印表機</th><th>文件</th><th>政策</th><th>原因</th></tr></thead><tbody id="violationRows"></tbody></table></div></section>
</main><script src="app.js"></script></body></html>
