<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintGuard 管理員登入</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="auth.css"></head>
<body class="login-page"><main class="login-shell"><section class="login-card"><div class="login-brand"><span>PG</span><b>PrintGuard</b></div><p class="eyebrow">管理者認證</p><h1 id="loginTitle">管理員登入</h1><p id="loginHint">公開總覽不需登入；列印工作、報表與管理設定需要管理員認證。</p><form id="loginForm"><label>管理員帳號<input id="username" autocomplete="username" required minlength="3" maxlength="64"></label><label>密碼<input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"></label><p id="loginError"></p><button id="loginSubmit" type="submit">登入</button></form><a class="login-note" href="/">返回公開總覽</a><small class="login-note">帳密只儲存在這台 PrintGuard 主機，系統不保存明碼密碼。</small></section></main><script src="login.js"></script></body></html>
